[package]
name = "dsk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Disk usage analyzer that finds where space goes and what build artifacts can be reclaimed"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/thesurlydev/dsk"
keywords = ["disk-usage", "du", "cleanup", "build-artifacts", "tui"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
# getattrlist, for the bytes of a file that APFS clones do not share.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Lint baseline; repo-specific lints below it.
[lints.clippy]
# Left-in debugging and stubs. No repo had any; the lints keep it that way.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Panics. unwrap() says nothing about why it cannot fail; expect() with the invariant is allowed.
unwrap_used = "warn"

# Suppressions and unsafe. #[expect] warns once the lint stops firing; #[allow] never does.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
mem_forget = "warn"

# Ownership and allocation.
redundant_clone = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
needless_collect = "warn"
or_fun_call = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
large_types_passed_by_value = "warn"
large_stack_arrays = "warn"
rc_buffer = "warn"

# API shape and async.
ref_option = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"

# Tuned for build time and a small target/ directory, not binary size.
[profile.dev]
debug = "line-tables-only"
